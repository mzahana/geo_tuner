/**:
  # "/**" so this file applies whatever namespace the conductor is
  # launched into (ns:=interceptor and a bare field stack alike). A
  # fixed node path is silently ignored when it does not match, and
  # the session would then fly on code defaults, not these limits.
  ros__parameters:
    # Node name of the running geometric controller (must match its launch)
    controller_node: "geometric_controller_node"
    setpoint_topic: "geometric_controller/multi_dof_setpoint"
    odom_topic: "geometric_controller/odom"

    # Where to hover while tuning (odom/local frame!). Pick >= 10 m AGL
    # over clear ground and inside your geofence.
    hover_position: [0.0, 0.0, 10.0]

    step_size: 0.5          # m, lateral test steps
    step_size_z: 0.4        # m, vertical test steps
    settle_time: 4.0        # s of quiet hover before each step
    episode_time: 6.0       # s recorded per step
    episode_dump_dir: ""    # set to a directory to save raw per-episode CSVs
    hover_timeout: 25.0     # s to reach/keep the hover point

    # --- manoeuvre envelope ---
    # The vehicle stays within +/- these of the hover point: steps go out
    # and come straight back, they never accumulate. Set them to the space
    # you actually have. Live-settable (RViz Tuner panel / ros2 param set);
    # a change applies from the next episode.
    #   max_step_size   hard ceiling on any live change
    #   the real limit is 0.8 x safety.max_pos_error, since a step commands
    #   its full amplitude as instantaneous position error
    #   small_step_warn below this the response may not clear odometry
    #   noise and the fit-quality gate starts rejecting episodes
    max_step_size: 1.0
    min_step_size: 0.05
    max_yaw_step: 1.0
    small_step_warn: 0.25
    hover_capture_radius: 0.3
    hover_capture_speed: 0.3
    service_timeout: 5.0

    axes: "z,x,y,yaw"           # z first: thrust-map errors show up there
    # Bandwidth ladder [rad/s]: each rung is identified before moving up.
    # Keep the last rung <= (2/attctrl_tau)/4 and <= 0.35/latency.
    wn_ladder: [1.2, 1.6, 2.0]
    zeta_target: 0.95
    max_gain_change_factor: 1.6
    # How far the identified loop must stay clear of the Routh-Hurwitz
    # stability boundary before the ladder climbs a rung. The closed loop
    # is tau*s^3 + s^2 + alpha*kv*s + alpha*kx, unstable at kv = tau*kx, so
    # the cap is wn <= 2*zeta / (stability_margin * tau_measured). 1.0 is
    # the boundary itself; 4 keeps a 4x margin on the Routh product and is
    # about as conservative as the old wn*delay <= 0.45 rule.
    stability_margin: 4.0
    # Repeat each step this many times per (axis, rung); gains update
    # from the MEDIAN identified alpha. 3 gives reproducible gains at
    # ~2x session length; the consistency gate blocks updates when the
    # accepted estimates disagree by more than this factor.
    episodes_per_rung: 3
    estimate_consistency: 1.35

    # --- session-time reduction (keeps every quality gate) ---
    # Fly the return leg as a recorded episode instead of dead time,
    # leave SETTLE/STEP as soon as the vehicle is demonstrably settled,
    # and stop a bucket early when the reps already agree more tightly
    # than the consistency gate demands. settle_time / episode_time stay
    # the hard caps, so a noisy plant simply degrades to the old timing.
    bidirectional_episodes: true
    min_episodes_per_rung: 2
    early_stop_spread: 1.15
    adaptive_episode: true
    min_episode_time: 2.0
    episode_quiet_time: 0.5
    episode_settle_band: 0.04
    episode_settle_periods: 4.0
    min_settle_time: 0.3
    settle_quiet_time: 0.5
    settle_tol_pos: 0.1
    settle_tol_vel: 0.15
    settle_tol_yaw: 0.05

    report_path: "/tmp/geo_tuner_report.yaml"

    safety:
      max_tilt: 0.6         # rad; RC takeover threshold is the pilot
      max_pos_error: 2.0    # m from active setpoint
      max_velocity: 4.0     # m/s
      min_altitude: 5.0     # m — well above ground for field tuning
      max_altitude: 40.0
      odom_timeout: 0.4     # s without odometry -> abort
      osc_rate_rms: 1.2     # rad/s roll/pitch rate RMS -> abort
