/**:
  # "/**" so this file applies whatever namespace the conductor is
  # launched into (ns:=interceptor and a bare field stack alike). A
  # fixed node path is silently ignored when it does not match, and
  # the session would then fly on code defaults, not these limits.
  ros__parameters:
    # Matches d2dtracker_sim SITL (sitl_bringup.launch.py, default world,
    # spawn at origin, `commander takeoff` altitude ~2.5 m).
    controller_node: "interceptor/geometric_controller_node"
    setpoint_topic: "geometric_controller/multi_dof_setpoint"
    odom_topic: "geometric_controller/odom"

    # SITL flies with a pilot in the loop (px4 takeoff + OFFBOARD), so the
    # hover point is captured at handover like the field. hover_position is
    # read only in "fixed" mode.
    hover_mode: "capture"
    hover_position: [0.0, 0.0, 2.5]
    min_tuning_altitude: 3.0    # m AGL
    agl_topic: "mavros/global_position/rel_alt"

    step_size: 0.5
    step_size_z: 0.4
    settle_time: 4.0
    episode_time: 6.0
    output_dir: ""          # one knob: timestamped report + episode CSVs per session go here
    episode_dump_dir: ""    # explicit CSV dir when output_dir is unset
    hover_timeout: 25.0

    # --- manoeuvre envelope ---
    # The vehicle stays within +/- these of the hover point: steps go out
    # and come straight back, they never accumulate. Set them to the space
    # you actually have. Live-settable (RViz Tuner panel / ros2 param set);
    # a change applies from the next episode.
    #   max_step_size   hard ceiling on any live change
    #   the real limit is 0.8 x safety.max_pos_error, since a step commands
    #   its full amplitude as instantaneous position error
    #   small_step_warn below this the response may not clear odometry
    #   noise and the fit-quality gate starts rejecting episodes
    max_step_size: 1.0
    min_step_size: 0.05
    max_yaw_step: 1.0
    small_step_warn: 0.25
    hover_capture_radius: 0.3
    hover_capture_speed: 0.3
    service_timeout: 5.0

    axes: "z,x,y,yaw"
    # --- identification and decision (docs/ARCHITECTURE.md) ---
    # One bandwidth request; the lag-aware design lowers it on its own when
    # the identified lag would not keep the phase margins below.
    wn_target: 1.6
    wn_target_z: -1.0         # <= 0: same as wn_target
    zeta_target: 0.95
    # Classical robustness pair: nominal margin at the identified plant and a
    # floor on the worst plant inside the 90 % confidence interval.
    pm_nominal_deg: 45.0
    pm_worst_deg: 35.0
    # Estimation noise allowance: gains in force stand, and applied gains
    # validate, while within this of the margins above.
    pm_tolerance_deg: 5.0
    # Gains within this fraction of the range the evidence supports stand.
    gain_tolerance: 0.10
    max_gain_change_factor: 1.6
    # Rounds: identify -> apply -> validate on fresh data. 3 lets a
    # rate-limited update continue once and still be validated.
    max_rounds: 3
    episodes_per_round: 4     # one bidirectional cycle per axis per round
    validation_max_overshoot: 0.25
    yaw_tolerance: 0.25       # yaw T within 25 % of yaw_time_constant confirms
    estimate_consistency: 1.35   # yaw per-episode agreement
    id_confidence: 0.90
    # geometric_mavros must report enable_thrust_estimator false before a
    # session starts. "" skips the check: simulators without that node only.
    estimator_node: "geometric_mavros_node"

    # Written into the shared volume so it is visible on the host too
    # --- session-time reduction (keeps every quality gate) ---
    # Fly the return leg as a recorded episode instead of dead time,
    # leave SETTLE/STEP as soon as the vehicle is demonstrably settled,
    # settle_time / episode_time stay
    # the hard caps, so a noisy plant simply degrades to the old timing.
    bidirectional_episodes: true
    adaptive_episode: true
    min_episode_time: 2.0
    episode_quiet_time: 0.5
    episode_settle_band: 0.04
    episode_settle_periods: 4.0
    min_settle_time: 0.3
    settle_quiet_time: 0.4
    settle_tol_pos: 0.06
    settle_tol_vel: 0.1
    settle_tol_yaw: 0.05

    report_path: "/home/user/shared_volume/geo_tuner_report.yaml"

    safety:
      max_tilt: 0.6
      max_pos_error: 2.5
      max_velocity: 4.0
      min_altitude: 1.0     # m AGL
      max_altitude: 20.0
      odom_timeout: 0.4
      osc_rate_rms: 1.2
